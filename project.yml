# XcodeGen 工程定义文件
#
# 用法：在 Mac 上安装 XcodeGen 后，在本目录执行 `xcodegen generate`
# 就会自动生成 XiaoBenJiZhang.xcodeproj 工程文件（工程文件不入库，见 .gitignore）。
# 这样任何人拿到这份代码都能一键得到可编译的 Xcode 工程，不用手动建工程。
name: XiaoBenJiZhang

options:
  bundleIdPrefix: com.xiaobenjizhang
  # 最低系统版本：iOS 26（液态玻璃 API 需要的系统版本，iOS 27 同样可以运行）
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  XiaoBenJiZhang:
    type: application
    platform: iOS
    sources:
      - path: XiaoBenJiZhang
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobenjizhang.app
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: 小本记账
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  XiaoBenJiZhang:
    build:
      targets:
        XiaoBenJiZhang: all
    run:
      config: Debug
    archive:
      config: Release
