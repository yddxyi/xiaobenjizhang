name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    name: 打包真机版未签名 IPA（供 p12 自签）
    runs-on: macos-26
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build device app (unsigned)
        run: |
          xcodebuild \
            -project XiaoBenJiZhang.xcodeproj \
            -scheme XiaoBenJiZhang \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/XiaoBenJiZhang.app"
          if [ ! -d "$APP" ]; then
            echo "未找到编译产物 $APP"; exit 1
          fi
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry XiaoBenJiZhang-unsigned.ipa Payload
          ls -lh XiaoBenJiZhang-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoBenJiZhang-unsigned-ipa
          path: XiaoBenJiZhang-unsigned.ipa
